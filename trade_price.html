<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTC Monthly Closing Price (USD)</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #121212; /* Dark background */
            color: #e0e0e0; /* Light text */
            margin: 20px;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #ffffff;
        }
        .table-container {
            overflow-x: auto;
            background: #1e1e1e; /* Darker container background */
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th, td {
            padding: 10px;
            text-align: center;
            border: 1px solid #333; /* Darker borders */
        }
        th {
            font-weight: 600;
            color: #aaa;
            background-color: #1e1e1e;
        }
        .year-cell {
            font-weight: bold;
            text-align: left;
            padding-left: 15px;
            background-color: #1e1e1e; /* Match container */
            color: #fff;
            position: sticky;
            left: 0;
            z-index: 1;
            border-right: 1px solid #444;
        }
        .cell {
            color: #fff; /* Text always white/light on colored cells */
            font-weight: 500;
            border-radius: 4px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5); /* Better readability on bright colors */
        }
        
        .loading {
            text-align: center;
            font-size: 0.9em;
            color: #888;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>BTC Monthly Closing Price (USD)</h1>
    
    <div class="table-container">
        <table id="price-table">
            <thead>
                <tr>
                    <th>Year</th>
                    <th>Jan</th>
                    <th>Feb</th>
                    <th>Mar</th>
                    <th>Apr</th>
                    <th>May</th>
                    <th>Jun</th>
                    <th>Jul</th>
                    <th>Aug</th>
                    <th>Sep</th>
                    <th>Oct</th>
                    <th>Nov</th>
                    <th>Dec</th>
                </tr>
            </thead>
            <tbody>
                <!-- Rows will be inserted here -->
            </tbody>
        </table>
        <div id="status" class="loading">Loading live data...</div>
    </div>

    <!--
    Логика обновления данных с Binance:
    1. Получаем свечи за все время (или максимально доступное).
    2. Берем цену закрытия (Close price) каждой свечи.
    3. Заполняем таблицу.
    -->
    <script>
        // Инициализируем пустой объект, будем заполнять его данными с Binance
        // Структура: { 2024: [priceJan, priceFeb, ...], ... }
        const btcPrices = {};

        function formatPrice(price) {
            if (price === null || price === undefined) return '';
            // Форматируем цену: если < 1000, показываем как есть, иначе с разделителями тысяч
            // Округляем до целых для экономии места, если цена большая
            if (price >= 1000) {
                return Math.round(price).toLocaleString('en-US');
            }
            return price.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        async function fetchAllData() {
            try {
                // Публичный API Binance для свечей (monthly - klines)
                // Пара: BTCUSDT, Интервал: 1M
                // limit=1000 (максимум) хватит на ~83 года, так что получим всю историю с 2017 (на Binance)
                // Для более ранней истории (2011-2017) придется захардкодить или искать другой источник.
                // Binance запустился в 2017. 
                // Я добавлю хардкод для 2011-2017 (примерные цены закрытия с CoinGecko/других источников).
                
                // Хардкод исторических данных (примерные цены закрытия месяца)
                // Источник: исторические данные (CoinMarketCap / Investing)
                
                const historicalData = {
                    2011: [0.5, 0.9, 0.8, 3.5, 8.9, 16.4, 13.4, 8.2, 5.1, 3.3, 3.0, 4.7],
                    2012: [5.5, 4.9, 4.9, 5.1, 5.2, 6.7, 9.4, 10.1, 12.4, 11.2, 12.6, 13.5],
                    2013: [20.4, 33.4, 93.0, 139, 129, 97.5, 106, 140, 137, 211, 1002, 754], // Ноябрь 2013 пик ~1100, закрытие ~1000
                    2014: [816, 546, 453, 450, 626, 640, 587, 477, 386, 337, 376, 318],
                    2015: [216, 253, 243, 235, 229, 262, 283, 229, 235, 312, 376, 430],
                    2016: [368, 437, 415, 449, 530, 672, 623, 574, 608, 699, 742, 963],
                    2017: [966, 1189, 1079, 1349, 2286, 2480, 2873, 4700] // До августа 2017 (Binance start)
                };

                // Заполняем хардкодом
                for (const year in historicalData) {
                    btcPrices[year] = historicalData[year];
                }

                // Получаем данные с Binance (с августа 2017 по настоящее время)
                const response = await fetch('https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1M&limit=1000');
                
                if (!response.ok) {
                    throw new Error('Ответ сети не ok');
                }
                
                const data = await response.json();
                
                data.forEach(candle => {
                    const openTime = candle[0];
                    const closePrice = parseFloat(candle[4]);
                    
                    const date = new Date(openTime);
                    const year = date.getFullYear();
                    const monthIndex = date.getMonth(); // 0 = Янв, 11 = Дек
                    
                    if (!btcPrices[year]) {
                        btcPrices[year] = new Array(12).fill(null);
                    }
                    
                    // Записываем цену закрытия
                    btcPrices[year][monthIndex] = closePrice;
                });
                
                document.getElementById('status').textContent = 'Данные обновлены (2011-2017: Архив, 2017+: Binance API)';
                renderTable();

            } catch (error) {
                console.error('Ошибка получения данных:', error);
                document.getElementById('status').textContent = 'Ошибка обновления. Проверьте консоль.';
            }
        }

        function renderTable() {
            const tbody = document.querySelector('#price-table tbody');
            tbody.innerHTML = ''; // Очищаем существующие строки
            
            const years = Object.keys(btcPrices).sort((a, b) => b - a);

            years.forEach(year => {
                const tr = document.createElement('tr');
                
                // Ячейка года
                const tdYear = document.createElement('td');
                tdYear.textContent = year;
                tdYear.className = 'year-cell';
                tr.appendChild(tdYear);
                
                // Ячейки месяцев
                let months = btcPrices[year];
                if (!months) months = new Array(12).fill(null);
                
                // Цикл от 0 до 11 для Янв-Дек
                for (let i = 0; i < 12; i++) {
                    const val = months[i];
                    const td = document.createElement('td');
                    
                    if (val !== null && val !== undefined) {
                        td.textContent = `$${formatPrice(val)}`;
                        // Можно добавить легкую расцветку фона в зависимости от цены (тепловая карта цен),
                        // но для абсолютных цен это сложно (экспоненциальный рост).
                        // Оставим просто темный фон или сделаем градиент по годам? 
                        // Пока просто прозрачный.
                        td.style.backgroundColor = 'rgba(255, 255, 255, 0.05)';
                    } else {
                        td.textContent = '';
                    }
                    
                    td.className = 'cell';
                    tr.appendChild(td);
                }
                
                tbody.appendChild(tr);
            });
        }

        // Запуск
        fetchAllData();
    </script>
</body>
</html>
